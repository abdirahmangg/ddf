name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ddf
          POSTGRES_PASSWORD: ddf_password
          POSTGRES_DB: ddf_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      openfga:
        image: openfga/openfga:latest
        ports:
          - 8081:8081
          - 3000:3000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,openfga]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Type check with mypy
        run: mypy src/ddf

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql://ddf:ddf_password@localhost:5432/ddf_db
          OPENFGA_HOST: localhost
          OPENFGA_PORT: 8081
        run: pytest tests/ -v --cov=src/ddf --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit security check
        run: bandit -r src/ddf -f json -o bandit-report.json || true

      - name: Check dependencies with safety
        run: safety check --json || true

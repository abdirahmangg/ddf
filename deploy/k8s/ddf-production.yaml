apiVersion: apps/v1
kind: Deployment
metadata:
  name: ddf
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ddf
  template:
    metadata:
      labels:
        app: ddf
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ddf
          image: ghcr.io/arkstride/ddf:VERSION
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: ddf-secrets
            - configMapRef:
                name: ddf-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /ready/dependencies
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ddf
spec:
  selector:
    app: ddf
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ddf
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: ddf
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ddf
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ddf
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ddf
spec:
  podSelector:
    matchLabels:
      app: ddf
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - {}

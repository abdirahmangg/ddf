version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ddf-postgres
    environment:
      POSTGRES_USER: ddf
      POSTGRES_PASSWORD: ddf_password
      POSTGRES_DB: ddf_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddf"]
      interval: 10s
      timeout: 5s
      retries: 5

  openfga:
    image: openfga/openfga:latest
    container_name: ddf-openfga
    command: run
    environment:
      - OPENFGA_LOG_FORMAT=json
    ports:
      - "8081:8081"
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
